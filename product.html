<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SastaGo Product Details</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #222;
  background: #fff;
}

.header {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  position: sticky;
  top: 0;
  background: white;
  z-index: 5;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: #16845b;
}

.header button {
  border: none;
  background: none;
  font-size: 24px;
  cursor: pointer;
}

.container {
  max-width: 750px;
  margin: auto;
  padding-bottom: 100px;
}

.gallery {
  height: 420px;
  background: linear-gradient(white 75%, #eee);
  display: flex;
  align-items: center;
  justify-content: center;
}

.gallery img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 15px;
}

.thumbnails {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 10px;
}

.thumbnails img {
  width: 55px;
  height: 55px;
  object-fit: contain;
  border: 1px solid #ddd;
  border-radius: 8px;
}

.details {
  padding: 18px;
}

.price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.mrp {
  color: #999;
}

.sale-price {
  color: #16845b;
  font-size: 25px;
  font-weight: bold;
}

h1 {
  font-size: 23px;
  margin: 15px 0;
}

.quantity-slabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 18px 0;
}

.slab {
  border: 1px solid #ddd;
  background: white;
  border-radius: 12px;
  padding: 14px 5px;
  text-align: center;
  cursor: pointer;
}

.slab small {
  display: block;
  color: #888;
  margin-top: 6px;
}

.slab.selected {
  border: 2px solid #16845b;
  background: #f0faf5;
}

.rating-row {
  display: flex;
  justify-content: space-between;
  color: #16845b;
  font-size: 20px;
  font-weight: bold;
}

.stars {
  color: #f4b400;
}

.section-title {
  font-size: 22px;
  margin-top: 28px;
}

.description {
  color: #777;
  line-height: 1.6;
}

.show-more {
  border: none;
  background: none;
  color: #16845b;
  font-weight: bold;
  cursor: pointer;
  padding: 5px 0;
}

.product-info {
  margin-top: 25px;
  border-top: 1px solid #eee;
  padding-top: 12px;
}

.product-info p {
  margin: 17px 0;
  color: #777;
}

.product-info b {
  color: #222;
}

.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 1px solid #eee;
  padding: 12px;
  display: flex;
  gap: 12px;
  z-index: 10;
}

.quantity-control {
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: #f3f3f3;
  border-radius: 12px;
  min-width: 40%;
  height: 58px;
}

.quantity-control button {
  border: none;
  background: none;
  font-size: 25px;
  cursor: pointer;
}

.quantity-control strong {
  font-size: 20px;
}

.add-button {
  flex: 1;
  border: none;
  border-radius: 12px;
  background: #111;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

.toast {
  display: none;
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  color: white;
  padding: 12px 20px;
  border-radius: 20px;
  z-index: 20;
}

@media(max-width:420px) {
  .gallery {
    height: 390px;
  }

  .details {
    padding: 15px 18px;
  }

  .quantity-slabs {
    gap: 6px;
  }

  .bottom-bar {
    padding: 10px;
  }

  .add-button {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div class="container">

<header class="header">
  <button onclick="history.back()">‹</button>
  <div class="logo">SastaGo</div>
  <button onclick="location.href='cart.html'">
    🛒 <span id="cartCount">0</span>
  </button>
</header>

<section class="gallery">
  <img id="mainImage" src="" alt="Product">
</section>

<div class="thumbnails" id="thumbnails"></div>

<main class="details">

  <div class="price-row">
    <div class="mrp">
      MRP <del id="mrpText">Rs. 300</del>
    </div>
    <div class="sale-price" id="saleText">Rs. 245</div>
  </div>

  <h1 id="productName">Product Name</h1>

  <div class="quantity-slabs" id="quantitySlabs"></div>

  <div class="rating-row">
    <span>Ratings</span>
    <span class="stars" id="ratingText">★★★★★ 5.0</span>
  </div>

  <h2 class="section-title">Description</h2>

  <div class="description" id="description">
    Product description will appear here.
  </div>

  <button class="show-more" id="showMore" hidden>
    👇 Show more
  </button>

  <h2 class="section-title">Product Information</h2>

  <div class="product-info">
    <p>♧ <b>Category:</b> <span id="categoryText">—</span></p>
    <p>▣ <b>Brand:</b> <span id="brandText">—</span></p>
    <p>▢ <b>Added:</b> <span id="addedText">—</span></p>
    <p>● <b>Availability:</b> <span id="stockText">—</span></p>
  </div>

</main>
</div>

<footer class="bottom-bar">

  <div class="quantity-control">
    <button id="minusQty">−</button>
    <strong id="quantity">1</strong>
    <button id="plusQty">+</button>
  </div>

  <button class="add-button" id="addToCart">
    Add to Cart • Rs. 245
  </button>

</footer>

<div class="toast" id="toast"></div>

<script type="module" src="./customer.js"></script>

</body>
</html>
