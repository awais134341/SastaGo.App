<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087b43">
<title>SastaGo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(145deg, #087b43, #10a75d);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    overflow: hidden;
}

.intro {
    width: 100%;
    max-width: 450px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
}

.logo {
    width: 115px;
    height: 115px;
    border-radius: 30px;
    background: white;
    color: #07934e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 75px;
    font-weight: 900;
    box-shadow: 0 12px 30px #004d2b55;
    animation: float 2s infinite ease-in-out;
}

.brand {
    font-size: 43px;
    font-weight: 900;
    margin-top: 22px;
    letter-spacing: 1px;
}

.brand span {
    color: #ffd166;
}

.tagline {
    font-size: 16px;
    margin-top: 10px;
    color: #e8fff0;
}

.shopping {
    font-size: 85px;
    margin: 35px 0;
    animation: bounce 2s infinite;
}

.description {
    font-size: 14px;
    line-height: 1.6;
    color: #e3ffed;
    margin-bottom: 30px;
}

.start-btn {
    width: 100%;
    max-width: 280px;
    padding: 16px;
    background: #ffd166;
    color: #155b36;
    border: none;
    border-radius: 15px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 7px 20px #004d2b55;
    transition: .3s;
}

.start-btn:hover {
    transform: scale(1.05);
    background: #ffe19a;
}

.loading {
    margin-top: 28px;
    font-size: 12px;
    color: #d8ffdf;
    letter-spacing: 2px;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}
</style>
</head>

<body>

<div class="intro">

    <div class="logo">S</div>

    <div class="brand">
        Sasta<span>Go</span>
    </div>

    <div class="tagline">
        Har Cheez, Aap Ke Qareeb!
    </div>

    <div class="shopping">🛍️</div>

    <div class="description">
        Welcome to SastaGo!<br>
        Discover everyday essentials and enjoy easy shopping.
    </div>

    <button class="start-btn" onclick="startShopping()">
        GET STARTED →
    </button>

    <div class="loading">
        YOUR SHOPPING DESTINATION
    </div>

</div>

<script>
function startShopping() {
    window.location.href = "customer.html";
}
</script>

</body>
</html>
