name: SastaGo Customer and Admin APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ==========================================
  # CUSTOMER APP BUILD
  # Repository root must contain SastaGo-Customer-Updated.zip
  # ==========================================
  build-customer:
    name: Build SastaGo Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Customer ZIP
        run: |
          test -f SastaGo-Customer-Updated.zip || {
            echo "SastaGo-Customer-Updated.zip missing from repository root"
            exit 1
          }

          rm -rf customer-src www
          mkdir -p customer-src www

          python3 - <<'PYZIP'
          import zipfile
          from pathlib import Path

          archive = Path("SastaGo-Customer-Updated.zip")
          root = Path("customer-src").resolve()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {name}")
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, target.open("wb") as dst:
                          dst.write(src.read())
          PYZIP

          ENTRY=$(find customer-src -type f -iname "Intro.html" -print -quit)
          if [ -z "$ENTRY" ]; then
            ENTRY=$(find customer-src -type f -iname "customer.html" -print -quit)
          fi
          test -n "$ENTRY" || { echo "Customer Intro.html/customer.html missing"; exit 1; }

          cp -a "$(dirname "$ENTRY")"/. www/
          if [ -f www/Intro.html ]; then
            cp www/Intro.html www/index.html
          elif [ -f www/intro.html ]; then
            cp www/intro.html www/index.html
          elif [ -f www/customer.html ]; then
            cp www/customer.html www/index.html
          else
            echo "Customer entry HTML missing after extraction"
            exit 1
          fi

          test -f www/customer.js
          test -f www/customer-bill-tools.js
          test -f www/customer-location.js
          test -f www/customer-gps-capacitor.js

      - name: Prepare Customer App Icon
        run: |
          mkdir -p assets
          ICON=$(find customer-src -type f -iname "sastago-icon.svg" -print -quit)
          test -n "$ICON" || { echo "sastago-icon.svg missing in Customer ZIP"; exit 1; }
          npm init -y
          npm install --no-save sharp
          ICON_FILE="$ICON" node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp(process.env.ICON_FILE)
            .resize(1024, 1024, { fit: 'contain', background: '#ffffff' })
            .png()
            .toFile('assets/icon.png');
          NODE

      - name: Install Customer Capacitor Dependencies
        run: |
          npm install --save-exact             @capacitor/core@8             @capacitor/cli@8             @capacitor/android@8             @capacitor/geolocation@8             @capgo/capacitor-file-sharer@8.1.16             @capgo/capacitor-printer@8.1.11             @capacitor/assets

          printf '%s\n'             '{"appId":"pk.sastago.customer","appName":"SastaGo","webDir":"www"}'             > capacitor.config.json

          npx capacitor-assets generate --android
          npx cap add android
          npx cap sync android

      - name: Configure Customer Android Manifest
        run: |
          python3 - <<'PYMAN'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          A = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()
          wanted = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]
          present = {x.get(A + "name") for x in root.findall("uses-permission")}
          for permission in wanted:
              if permission not in present:
                  node = ET.Element("uses-permission")
                  node.set(A + "name", permission)
                  root.insert(0, node)
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest application element missing")
          app.set(A + "label", "SastaGo")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          PYMAN

      - name: Build Customer APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # ADMIN APP BUILD
  # Repository root must contain SastaGo-Admin-Updated.zip
  # ==========================================
  build-admin:
    name: Build SastaGo Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Admin ZIP
        run: |
          test -f SastaGo-Admin-Updated.zip || {
            echo "SastaGo-Admin-Updated.zip missing from repository root"
            exit 1
          }

          rm -rf admin-src www
          mkdir -p admin-src www

          python3 - <<'PYZIP'
          import zipfile
          from pathlib import Path

          archive = Path("SastaGo-Admin-Updated.zip")
          root = Path("admin-src").resolve()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {name}")
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, target.open("wb") as dst:
                          dst.write(src.read())
          PYZIP

          ENTRY=$(find admin-src -type f -iname "admin.html" -print -quit)
          test -n "$ENTRY" || { echo "admin.html missing in Admin ZIP"; exit 1; }
          cp -a "$(dirname "$ENTRY")"/. www/
          cp "$ENTRY" www/index.html
          test -f www/admin.js
          test -f www/admin-bill-tools.js

      - name: Prepare Admin App Icon
        run: |
          mkdir -p assets
          ICON=$(find admin-src -type f -iname "admin-icon.png" -print -quit)
          if [ -n "$ICON" ]; then
            cp "$ICON" assets/icon.png
          else
            ICON=$(find admin-src -type f -iname "sastago-icon.svg" -print -quit)
            test -n "$ICON" || { echo "admin-icon.png or sastago-icon.svg missing in Admin ZIP"; exit 1; }
            npm init -y
            npm install --no-save sharp
            ICON_FILE="$ICON" node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp(process.env.ICON_FILE)
            .resize(1024, 1024, { fit: 'contain', background: '#ffffff' })
            .png()
            .toFile('assets/icon.png');
          NODE
          fi

      - name: Install Admin Capacitor Dependencies
        run: |
          npm install --save-exact             @capacitor/core@8             @capacitor/cli@8             @capacitor/android@8             @capacitor/geolocation@8             @capgo/capacitor-file-sharer@8.1.16             @capgo/capacitor-printer@8.1.11             @capacitor/assets

          printf '%s\n'             '{"appId":"pk.sastago.admin","appName":"SastaGo Admin","webDir":"www"}'             > capacitor.config.json

          npx capacitor-assets generate --android
          npx cap add android
          npx cap sync android

      - name: Configure Admin Android Manifest
        run: |
          python3 - <<'PYMAN'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          A = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()
          wanted = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]
          present = {x.get(A + "name") for x in root.findall("uses-permission")}
          for permission in wanted:
              if permission not in present:
                  node = ET.Element("uses-permission")
                  node.set(A + "name", permission)
                  root.insert(0, node)
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest application element missing")
          app.set(A + "label", "SastaGo Admin")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          PYMAN

      - name: Build Admin APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
