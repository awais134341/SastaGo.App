name: Build SastaGo Customer and Admin APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-customer:
    name: Build Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract Customer App
        run: |
          mkdir customer-project
          unzip Customer-App.zip -d customer-project
          cd customer-project/Customer-App

          cp Intro.html index.html

          npm init -y

          npm install vite@latest
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npm install @capacitor/geolocation@8
          npm install @capgo/capacitor-file-sharer@8.1.16
          npm install @capgo/capacitor-printer@8.1.11

      - name: Configure Customer Vite
        run: |
          cd customer-project/Customer-App

          cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite';

          export default defineConfig({
            base: './',
            build: {
              outDir: 'dist',
              emptyOutDir: true,
              rollupOptions: {
                external: (id) => id.startsWith('https://www.gstatic.com/')
              }
            }
          });
          EOF

      - name: Build Customer Web App
        run: |
          cd customer-project/Customer-App
          npx vite build

      - name: Configure Customer Capacitor
        run: |
          cd customer-project/Customer-App

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "pk.sastago.customer",
            "appName": "SastaGo",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Add Customer Location Permissions
        run: |
          cd customer-project/Customer-App

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          ]

          for permission in permissions:
              name = permission.split('"')[1]
              if name not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)

          p.write_text(s)
          PY

      - name: Build Customer APK
        run: |
          cd customer-project/Customer-App/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: customer-project/Customer-App/android/app/build/outputs/apk/debug/app-debug.apk


  build-admin:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Admin App
        run: |
          mkdir admin-project
          unzip Admin-App.zip -d admin-project
          cd admin-project/Admin-App

          cp admin.html index.html

          npm init -y

          npm install vite@latest
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npm install @capgo/capacitor-file-sharer@8.1.16
          npm install @capgo/capacitor-printer@8.1.11

      - name: Configure Admin Vite
        run: |
          cd admin-project/Admin-App

          cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite';

          export default defineConfig({
            base: './',
            build: {
              outDir: 'dist',
              emptyOutDir: true,
              rollupOptions: {
                external: (id) => id.startsWith('https://www.gstatic.com/')
              }
            }
          });
          EOF

      - name: Build Admin Web App
        run: |
          cd admin-project/Admin-App
          npx vite build

      - name: Configure Admin Capacitor
        run: |
          cd admin-project/Admin-App

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "pk.sastago.admin",
            "appName": "SastaGo Admin",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build Admin APK
        run: |
          cd admin-project/Admin-App/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Admin-APK
          path: admin-project/Admin-App/android/app/build/outputs/apk/debug/app-debug.apk
