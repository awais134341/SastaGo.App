name: SastaGo Customer and Admin APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-customer:
    name: Build Customer APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Customer ZIP and normalize permissions
        run: |
          test -f SastaGo-Customer-Bill-Fix.zip || { echo 'SastaGo-Customer-Bill-Fix.zip missing from repository root'; exit 1; }
          rm -rf customer-src www
          mkdir -p customer-src www
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          archive = Path('SastaGo-Customer-Bill-Fix.zip')
          root = Path('customer-src').resolve()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace('\\\\', '/')
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'Unsafe ZIP path: {name}')
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      os.chmod(target, 0o755)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, open(target, 'wb') as dst:
                          dst.write(src.read())
                      os.chmod(target, 0o644)
          for current, dirs, files in os.walk(root):
              os.chmod(current, 0o755)
              for filename in files:
                  os.chmod(Path(current) / filename, 0o644)
          PY
          ENTRY=$(find customer-src -type f -iname 'Intro.html' -print -quit)
          if [ -z "$ENTRY" ]; then ENTRY=$(find customer-src -type f -iname 'customer.html' -print -quit); fi
          if [ -z "$ENTRY" ]; then echo 'Customer entry HTML not found'; find customer-src -type f -print; exit 1; fi
          cp -r "$(dirname "$ENTRY")"/. www/
          find www -type d -exec chmod 755 {} +
          find www -type f -exec chmod 644 {} +
          if [ -f www/Intro.html ]; then cp www/Intro.html www/index.html;
          elif [ -f www/intro.html ]; then cp www/intro.html www/index.html;
          elif [ -f www/customer.html ]; then cp www/customer.html www/index.html;
          else echo 'Customer index page not found'; exit 1; fi
          test -r www/index.html || { echo 'Customer index.html is not readable'; exit 1; }
          test -f www/customer-location.js || { echo 'customer-location.js missing'; exit 1; }
          test -f www/customer-bill-tools.js || { echo 'customer-bill-tools.js missing'; exit 1; }
          echo 'Customer ZIP extracted and permissions normalized.'

      - name: Install Capacitor 8 and Customer plugins
        run: |
          npm init -y
          npm install --save-exact \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/geolocation@8 \
            @capgo/capacitor-file-sharer@8.1.16 \
            @capgo/capacitor-printer@8.1.11
          printf '%s\n' '{"appId":"pk.sastago.customer","appName":"SastaGo Customer","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Add Android GPS permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"

      - name: Build Customer APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-admin:
    name: Build Admin APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Admin ZIP and normalize permissions
        run: |
          test -f SastaGo-Admin-Bill-Fix.zip || { echo 'SastaGo-Admin-Bill-Fix.zip missing from repository root'; exit 1; }
          rm -rf admin-src www
          mkdir -p admin-src www
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          archive = Path('SastaGo-Admin-Bill-Fix.zip')
          root = Path('admin-src').resolve()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace('\\\\', '/')
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'Unsafe ZIP path: {name}')
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      os.chmod(target, 0o755)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, open(target, 'wb') as dst:
                          dst.write(src.read())
                      os.chmod(target, 0o644)
          for current, dirs, files in os.walk(root):
              os.chmod(current, 0o755)
              for filename in files:
                  os.chmod(Path(current) / filename, 0o644)
          PY
          ENTRY=$(find admin-src -type f -iname 'admin.html' -print -quit)
          if [ -z "$ENTRY" ]; then echo 'admin.html not found'; find admin-src -type f -print; exit 1; fi
          cp -r "$(dirname "$ENTRY")"/. www/
          find www -type d -exec chmod 755 {} +
          find www -type f -exec chmod 644 {} +
          cp "$ENTRY" www/index.html
          test -r www/index.html || { echo 'Admin index.html is not readable'; exit 1; }
          test -f www/admin.js || { echo 'admin.js missing'; exit 1; }
          test -f www/admin-bill-tools.js || { echo 'admin-bill-tools.js missing'; exit 1; }
          echo 'Admin ZIP extracted and permissions normalized.'

      - name: Install Capacitor 8 and Admin bill plugins
        run: |
          npm init -y
          npm install --save-exact \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capgo/capacitor-file-sharer@8.1.16 \
            @capgo/capacitor-printer@8.1.11
          printf '%s\n' '{"appId":"pk.sastago.admin","appName":"SastaGo Admin","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build Admin APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
