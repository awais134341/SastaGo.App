name: SastaGo Customer Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SastaGo-Customer-Updated.zip'
      - '.github/workflows/sastago-customer-only.yml'

permissions:
  contents: read

jobs:
  build-customer:
    name: Build SastaGo Customer APK Only
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --licenses </dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract Customer ZIP
        run: |
          test -f SastaGo-Customer-Updated.zip || {
            echo 'SastaGo-Customer-Updated.zip repository root mein nahi mili.'
            exit 1
          }
          mkdir -p customer-src
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          z = zipfile.ZipFile('SastaGo-Customer-Updated.zip')
          matches = [n for n in z.namelist() if n.endswith('/Customer-App/package.json')]
          if len(matches) != 1:
              raise SystemExit(f'Customer-App folder identify nahi hua: {matches}')
          prefix = matches[0][:-len('package.json')]
          for name in z.namelist():
              if name.startswith(prefix) and not name.endswith('/'):
                  rel = name[len(prefix):]
                  target = Path('customer-src') / rel
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
          PY
          test -s customer-src/package.json
          test -s customer-src/sastago-icon.png

      - name: Install Customer Dependencies
        working-directory: customer-src
        run: |
          npm install
          npm install --save @capacitor/android@^8 @capacitor/cli@^8 @capacitor/filesystem@^8
          npm install --save-dev @capacitor/assets sharp

      - name: Build Customer Web Bundles
        working-directory: customer-src
        run: |
          npm run build:web
          test -s customer.bundle.js
          test -s customer-location.bundle.js
          test -s customer-bill-tools.bundle.js

      - name: Configure Capacitor Customer App
        working-directory: customer-src
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg = {
            appId: 'pk.sastago.customer',
            appName: 'SastaGo',
            webDir: 'www',
            bundledWebRuntime: false
          };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          fs.mkdirSync('www', {recursive:true});
          for (const name of fs.readdirSync('.')) {
            if (['www','android','node_modules','.git'].includes(name)) continue;
            fs.cpSync(name, `www/${name}`, {recursive:true});
          }
          NODE
          npx cap add android
          npx cap sync android

      - name: Generate Customer Launcher Icons
        working-directory: customer-src
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import fs from 'node:fs';
          const src = 'sastago-icon.png';
          const res = 'android/app/src/main/res';
          const sizes = {mdpi:48, hdpi:72, xhdpi:96, xxhdpi:144, xxxhdpi:192};
          for (const [density,size] of Object.entries(sizes)) {
            const dir = `${res}/mipmap-${density}`;
            fs.mkdirSync(dir,{recursive:true});
            const png = await sharp(src).resize(size,size,{fit:'contain',background:'#ffffff'}).png().toBuffer();
            fs.writeFileSync(`${dir}/ic_launcher.png`,png);
            fs.writeFileSync(`${dir}/ic_launcher_round.png`,png);
          }
          fs.mkdirSync(`${res}/drawable`,{recursive:true});
          await sharp(src).resize(288,288,{fit:'contain',background:{r:255,g:255,b:255,alpha:0}}).png().toFile(`${res}/drawable/ic_launcher_foreground.png`);
          fs.mkdirSync(`${res}/values`,{recursive:true});
          fs.writeFileSync(`${res}/values/ic_launcher_background.xml`,'<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#FFFFFF</color></resources>');
          fs.mkdirSync(`${res}/mipmap-anydpi-v26`,{recursive:true});
          const adaptive='<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>';
          fs.writeFileSync(`${res}/mipmap-anydpi-v26/ic_launcher.xml`,adaptive);
          fs.writeFileSync(`${res}/mipmap-anydpi-v26/ic_launcher_round.xml`,adaptive);
          NODE
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='android/app/src/main/AndroidManifest.xml'
          ET.register_namespace('android','http://schemas.android.com/apk/res/android')
          A='{http://schemas.android.com/apk/res/android}'
          tree=ET.parse(p); root=tree.getroot(); app=root.find('application')
          if app is None: raise SystemExit('AndroidManifest application element missing')
          app.set(A+'label','SastaGo')
          app.set(A+'icon','@mipmap/ic_launcher')
          app.set(A+'roundIcon','@mipmap/ic_launcher_round')
          tree.write(p,encoding='utf-8',xml_declaration=True)
          ET.parse(p)
          PY

      - name: Build Customer Debug APK
        working-directory: customer-src/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: customer-src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
