name: SastaGo Customer App APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: sastago-customer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SastaGo Customer APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download Repository Files
        uses: actions/checkout@v4

      - name: Extract Customer App ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname 'Customer-App*.zip' | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Customer-App.zip not found!"
            find . -maxdepth 2 -type f
            exit 1
          fi

          mkdir -p extracted
          echo "Extracting $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Customer App
        shell: bash
        run: |
          APP_DIR=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if grep -q '"build:web"' "$FILE" &&
               [ -f "$DIR/capacitor.config.json" ]; then
              APP_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f -name package.json)

          if [ -z "$APP_DIR" ]; then
            echo "Customer App files not found!"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Found Customer App: $APP_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install App Dependencies
        run: |
          cd "$APP_DIR"
          npm install --no-audit --no-fund

      - name: Build Web App
        run: |
          cd "$APP_DIR"
          npm run build:web

      - name: Add Android Platform
        run: |
          cd "$APP_DIR"
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android Project
        run: |
          cd "$APP_DIR"
          npx cap sync android

      - name: Verify Android Project
        run: |
          test -f "$APP_DIR/android/gradlew"
          test -s "$APP_DIR/www/index.html"

      - name: Build Customer APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
