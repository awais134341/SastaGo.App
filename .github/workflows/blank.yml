name: Build SastaGo Customer and Admin APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # CUSTOMER APP
  # ==========================================

  build-customer:
    name: Build Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract Customer App
        run: |
          mkdir -p customer-project
          unzip Customer-App.zip -d customer-project

          cd customer-project/Customer-App

          # Fix ZIP file permissions
          chmod -R u+rwX .

          # Keep Intro screen as app opening page
          cp ./Intro.html ./index.html

      - name: Install Customer Dependencies
        run: |
          cd customer-project/Customer-App

          npm init -y

          npm install vite@6
          npm install @capacitor/core@8
          npm install @capacitor/cli@8
          npm install @capacitor/android@8
          npm install @capacitor/geolocation@8
          npm install @capgo/capacitor-file-sharer@8.1.16
          npm install @capgo/capacitor-printer@8.1.11

      - name: Configure Customer Vite
        run: |
          cd customer-project/Customer-App

          cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite';

          export default defineConfig({
            base: './',
            build: {
              outDir: 'dist',
              emptyOutDir: true,
              rollupOptions: {
                input: {
                  index: 'index.html',
                  customer: 'customer.html',
                  product: 'product.html'
                },
                external: (id) =>
                  id.startsWith('https://www.gstatic.com/')
              }
            }
          });
          EOF

      - name: Build Customer Web App
        run: |
          cd customer-project/Customer-App
          npx vite build

      - name: Configure Customer Capacitor
        run: |
          cd customer-project/Customer-App

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "pk.sastago.customer",
            "appName": "SastaGo",
            "webDir": "dist"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Add Customer Location Permissions
        run: |
          cd customer-project/Customer-App

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />'
          ]

          for permission in permissions:
              permission_name = permission.split('"')[1]

              if permission_name not in content:
                  content = content.replace(
                      '<application',
                      permission + '\n    <application',
                      1
                  )

          manifest.write_text(content)
          PY

      - name: Build Customer APK
        run: |
          cd customer-project/Customer-App/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: customer-project/Customer-App/android/app/build/outputs/apk/debug/app-debug.apk


  # ==========================================
  # ADMIN APP
  # ==========================================

  build-admin:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract Admin App
        run: |
          mkdir -p admin-project
          unzip Admin-App.zip -d admin-project

          cd admin-project/Admin-App

          # Fix ZIP file permissions
          chmod -R u+rwX .

          cp ./admin.html ./index.html

      - name: Install Admin Dependencies
        run: |
          cd admin-project/Admin-App

          npm init -y

          npm install vite@6
          npm install @capacitor/core@8
          npm install @capacitor/cli@8
          npm install @capacitor/android@8
          npm install @capgo/capacitor-file-sharer@8.1.16
          npm install @capgo/capacitor-printer@8.1.11

      - name: Configure Admin Vite
        run: |
          cd admin-project/Admin-App

          cat > vite.config.js <<'EOF'
          import { defineConfig } from 'vite';

          export default defineConfig({
            base: './',
            build: {
              outDir: 'dist',
              emptyOutDir: true,
              rollupOptions: {
                input: {
                  index: 'index.html'
                },
                external: (id) =>
                  id.startsWith('https://www.gstatic.com/')
              }
            }
          });
          EOF

      - name: Build Admin Web App
        run: |
          cd admin-project/Admin-App
          npx vite build

      - name: Configure Admin Capacitor
        run: |
          cd admin-project/Admin-App

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "pk.sastago.admin",
            "appName": "SastaGo Admin",
            "webDir": "dist"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build Admin APK
        run: |
          cd admin-project/Admin-App/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Admin-APK
          path: admin-project/Admin-App/android/app/build/outputs/apk/debug/app-debug.apk
