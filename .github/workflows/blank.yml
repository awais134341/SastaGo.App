name: SastaGo Customer Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: sastago-customer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-customer-apk:
    name: Build SastaGo Customer APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Customer App folder automatically
        shell: bash
        run: |
          APP_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if grep -q '"build:web"' "$file" &&
               [ -f "$DIR/capacitor.config.json" ]; then
              APP_DIR="$DIR"
              break
            fi
          done < <(find . -type f -name package.json)

          if [ -z "$APP_DIR" ]; then
            echo "Customer App folder not found."
            echo "Repository folders:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Customer App found: $APP_DIR"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          npm install --no-audit --no-fund

      - name: Build web assets
        run: |
          cd "$APP_DIR"
          npm run build:web

      - name: Create Android project if missing
        run: |
          cd "$APP_DIR"
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: |
          cd "$APP_DIR"
          npx cap sync android

      - name: Verify Android project
        run: |
          test -f "$APP_DIR/android/gradlew"
          test -s "$APP_DIR/www/index.html"

      - name: Build Customer APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-debug-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
