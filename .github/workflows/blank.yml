name: SastaGo Customer Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Customer-App/**'
      - '.github/workflows/android-customer-build.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'Customer-App/**'
      - '.github/workflows/android-customer-build.yml'

permissions:
  contents: read

concurrency:
  group: sastago-customer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-customer-apk:
    name: Build SastaGo Customer APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: Customer-App

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Customer App dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build:web

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -d www
          test -s www/index.html

      - name: Build Customer APK
        working-directory: Customer-App/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-debug-apk
          path: Customer-App/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
