name: SastaGo Customer App APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: sastago-customer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SastaGo Customer APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Customer App ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname 'Customer-App.zip' | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Customer-App.zip not found!"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          # Fix ZIP file permissions
          chmod -R u+rwX,go+rX extracted

          echo "ZIP extracted and permissions fixed."

      - name: Locate Customer App
        shell: bash
        run: |
          APP_DIR="extracted/Customer-App"

          if [ ! -f "$APP_DIR/package.json" ]; then
            echo "package.json not found!"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -f "$APP_DIR/capacitor.config.json" ]; then
            echo "Capacitor configuration missing!"
            exit 1
          fi

          if ! grep -q '"build:web"' "$APP_DIR/package.json"; then
            echo "build:web script missing from package.json!"
            cat "$APP_DIR/package.json"
            exit 1
          fi

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Customer App found successfully."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install App Dependencies
        run: |
          cd "$APP_DIR"
          npm install --no-audit --no-fund

      - name: Build Web App
        run: |
          cd "$APP_DIR"
          npm run build:web

      - name: Add Android Platform
        run: |
          cd "$APP_DIR"
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android Project
        run: |
          cd "$APP_DIR"
          npx cap sync android

      - name: Verify Android Project
        run: |
          test -f "$APP_DIR/android/gradlew"
          test -s "$APP_DIR/www/index.html"

      - name: Build Customer APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: extracted/Customer-App/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
