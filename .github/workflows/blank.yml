name: SastaGo Customer APK Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SastaGo Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Customer-App ZIP
        run: |
          unzip -q Customer-App.zip -d extracted
          chmod -R u+rwX,go+rX extracted

      - name: Find Customer Project
        run: |
          PROJECT_FILE=$(find extracted -name package.json | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "package.json not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Project found: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Build Web App
        run: |
          cd "$PROJECT_DIR"
          npm run build:web

      - name: Sync Capacitor Android
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build Android APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload SastaGo Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
