name: SastaGo Customer and Admin APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ==========================================
  # CUSTOMER APP BUILD
  # Repository root ZIP:
  # SastaGo-Customer-Complete-Optimized.zip
  # ==========================================
  build-customer:
    name: Build SastaGo Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Customer ZIP
        run: |
          test -f SastaGo-Customer-Complete-Optimized.zip || {
            echo "SastaGo-Customer-Complete-Optimized.zip missing from repository root"
            exit 1
          }

          rm -rf customer-src www
          mkdir -p customer-src www

          python3 - <<'PYZIP'
          import zipfile
          from pathlib import Path

          archive = Path("SastaGo-Customer-Complete-Optimized.zip")
          root = Path("customer-src").resolve()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {name}")
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, target.open("wb") as dst:
                          dst.write(src.read())
          PYZIP

          APP_DIR=$(find customer-src -type f -iname "build-customer.sh" -print -quit | xargs -r dirname)
          test -n "$APP_DIR" || { echo "Customer-App folder/build-customer.sh missing"; exit 1; }

          cp -a "$APP_DIR"/. www/

          if [ -f www/Intro.html ]; then
            cp www/Intro.html www/index.html
          elif [ -f www/intro.html ]; then
            cp www/intro.html www/index.html
          elif [ -f www/customer.html ]; then
            cp www/customer.html www/index.html
          else
            echo "Customer Intro.html/customer.html missing"
            exit 1
          fi

          test -f www/customer.js
          test -f www/customer-bill-tools.js
          test -f www/customer-location.js
          test -f www/build-customer.sh
          test -f www/resources/icon.png

      - name: Install Customer Capacitor and Bundler Dependencies
        run: |
          npm init -y
          npm install --save \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/geolocation@8 \
            @capgo/capacitor-file-sharer@8.1.16 \
            @capgo/capacitor-printer@8.1.11 \
            @capacitor/assets \
            sharp@^0.34.0 \
            esbuild@^0.25.0

      - name: Bundle Customer JavaScript for Android WebView
        run: |
          cd www
          chmod +x build-customer.sh
          bash ./build-customer.sh
          test -s customer.bundle.js
          test -s customer-location.bundle.js
          test -s customer-bill-tools.bundle.js

      - name: Configure Customer Capacitor and Generate Android Launcher Icons
        run: |
          printf '%s\n' \
            '{"appId":"pk.sastago.customer","appName":"SastaGo","webDir":"www"}' \
            > capacitor.config.json

          # @capacitor/assets reads its source icon from the PROJECT ROOT,
          # not from www/resources. Use the verified 1024x1024 PNG from the ZIP.
          mkdir -p assets
          cp www/resources/icon.png assets/icon.png
          test "$(file -b assets/icon.png | grep -c 'PNG image data')" -eq 1

          # Create the native Android project first, then generate adaptive and
          # legacy launcher icon resources into that Android project.
          npx cap add android
          # Sync native plugins first; generate launcher resources AFTER sync so
          # Capacitor/plugin sync cannot replace the custom launcher resources.
          npx cap sync android

          # Generate Android legacy + adaptive launcher icons from this app's
          # own 1024x1024 PNG. Customer and Admin jobs use different source PNGs.
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import fs from 'node:fs';
          const src = 'assets/icon.png';
          const res = 'android/app/src/main/res';
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          for (const [density, size] of Object.entries(sizes)) {
            const dir = `${res}/mipmap-${density}`;
            fs.mkdirSync(dir, { recursive: true });
            const png = await sharp(src).resize(size, size, { fit: 'contain', background: '#ffffff' }).png().toBuffer();
            fs.writeFileSync(`${dir}/ic_launcher.png`, png);
            fs.writeFileSync(`${dir}/ic_launcher_round.png`, png);
          }
          fs.mkdirSync(`${res}/drawable`, { recursive: true });
          await sharp(src).resize(288, 288, { fit: 'contain', background: { r: 255, g: 255, b: 255, alpha: 0 } })
            .png().toFile(`${res}/drawable/ic_launcher_foreground.png`);
          fs.mkdirSync(`${res}/values`, { recursive: true });
          fs.writeFileSync(`${res}/values/ic_launcher_background.xml`,
            '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#FFFFFF</color></resources>');
          fs.mkdirSync(`${res}/mipmap-anydpi-v26`, { recursive: true });
          const adaptive = '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>';
          fs.writeFileSync(`${res}/mipmap-anydpi-v26/ic_launcher.xml`, adaptive);
          fs.writeFileSync(`${res}/mipmap-anydpi-v26/ic_launcher_round.xml`, adaptive);
          NODE

          # Ensure Android actually points at the generated launcher resources.
          python3 - <<'PYMANIFEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          A = '{http://schemas.android.com/apk/res/android}'
          tree = ET.parse(path)
          app = tree.getroot().find('application')
          if app is None:
              raise SystemExit('AndroidManifest application element missing')
          app.set(A + 'icon', '@mipmap/ic_launcher')
          app.set(A + 'roundIcon', '@mipmap/ic_launcher_round')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          ET.parse(path)
          PYMANIFEST

          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Configure Customer Android Manifest
        run: |
          python3 - <<'PYMAN'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          A = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()
          wanted = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]
          present = {x.get(A + "name") for x in root.findall("uses-permission")}
          for permission in wanted:
              if permission not in present:
                  node = ET.Element("uses-permission")
                  node.set(A + "name", permission)
                  root.insert(0, node)
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest application element missing")
          app.set(A + "label", "SastaGo")
          app.set(A + "icon", "@mipmap/ic_launcher")
          app.set(A + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          PYMAN

      - name: Build Customer APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^(application-label|application-icon)"

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # ADMIN APP BUILD
  # Repository root ZIP:
  # SastaGo-Admin-With-Bill-PNG-Share-Print.zip
  # ==========================================
  build-admin:
    name: Build SastaGo Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Admin ZIP
        run: |
          test -f SastaGo-Admin-With-Bill-PNG-Share-Print.zip || {
            echo "SastaGo-Admin-With-Bill-PNG-Share-Print.zip missing from repository root"
            exit 1
          }

          rm -rf admin-src www
          mkdir -p admin-src www

          python3 - <<'PYZIP'
          import zipfile
          from pathlib import Path

          archive = Path("SastaGo-Admin-With-Bill-PNG-Share-Print.zip")
          root = Path("admin-src").resolve()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {name}")
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, target.open("wb") as dst:
                          dst.write(src.read())
          PYZIP

          APP_DIR=$(find admin-src -type f -iname "admin.html" -print -quit | xargs -r dirname)
          test -n "$APP_DIR" || { echo "Admin-App/admin.html missing"; exit 1; }

          cp -a "$APP_DIR"/. www/
          cp www/admin.html www/index.html

          test -f www/admin.js
          test -f www/admin-bill-tools.js

          mkdir -p www/resources
          ICON=$(find admin-src -type f -iname "admin-icon.png" -print -quit)
          if [ -n "$ICON" ]; then
            cp "$ICON" www/resources/icon.png
          else
            ICON=$(find admin-src -type f -iname "sastago-icon.svg" -print -quit)
            test -n "$ICON" || { echo "Admin icon or SastaGo SVG icon missing"; exit 1; }
            npm init -y
            npm install --no-save sharp
            ICON_FILE="$ICON" node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp(process.env.ICON_FILE)
            .resize(1024, 1024, { fit: 'contain', background: '#ffffff' })
            .png()
            .toFile('www/resources/icon.png');
          NODE
          fi

          test -s www/resources/icon.png

      - name: Install Admin Capacitor and Bundler Dependencies
        run: |
          npm init -y
          npm install --save \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/geolocation@8 \
            @capgo/capacitor-file-sharer@8.1.16 \
            @capgo/capacitor-printer@8.1.11 \
            @capacitor/assets \
            sharp@^0.34.0 \
            esbuild@^0.25.0

      - name: Bundle Admin JavaScript for Android WebView
        run: |
          cd www
          npx esbuild admin.js \
            --bundle --format=esm --platform=browser --target=es2020 \
            --external:https://* --outfile=admin.bundle.js

          npx esbuild admin-bill-tools.js \
            --bundle --format=esm --platform=browser --target=es2020 \
            --external:https://* --outfile=admin-bill-tools.bundle.js

          python3 - <<'PYHTML'
          from pathlib import Path
          p = Path("admin.html")
          html = p.read_text()
          html = html.replace('src="./admin-bill-tools.js"', 'src="./admin-bill-tools.bundle.js"')
          html = html.replace('src="admin-bill-tools.js"', 'src="admin-bill-tools.bundle.js"')
          html = html.replace('src="./admin.js"', 'src="./admin.bundle.js"')
          html = html.replace('src="admin.js"', 'src="admin.bundle.js"')
          p.write_text(html)
          PYHTML

          test -s admin.bundle.js
          test -s admin-bill-tools.bundle.js
          grep -q "admin.bundle.js" admin.html
          grep -q "admin-bill-tools.bundle.js" admin.html

      - name: Configure Admin Capacitor and Generate Android Launcher Icons
        run: |
          printf '%s\n' \
            '{"appId":"pk.sastago.admin","appName":"SastaGo Admin","webDir":"www"}' \
            > capacitor.config.json

          # The Admin PNG is a verified 1024x1024 source icon.
          mkdir -p assets
          cp www/resources/icon.png assets/icon.png
          test "$(file -b assets/icon.png | grep -c 'PNG image data')" -eq 1

          npx cap add android
          # Sync native plugins first; generate launcher resources AFTER sync so
          # Capacitor/plugin sync cannot replace the custom launcher resources.
          npx cap sync android

          # Generate Android legacy + adaptive launcher icons from this app's
          # own 1024x1024 PNG. Customer and Admin jobs use different source PNGs.
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import fs from 'node:fs';
          const src = 'assets/icon.png';
          const res = 'android/app/src/main/res';
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          for (const [density, size] of Object.entries(sizes)) {
            const dir = `${res}/mipmap-${density}`;
            fs.mkdirSync(dir, { recursive: true });
            const png = await sharp(src).resize(size, size, { fit: 'contain', background: '#ffffff' }).png().toBuffer();
            fs.writeFileSync(`${dir}/ic_launcher.png`, png);
            fs.writeFileSync(`${dir}/ic_launcher_round.png`, png);
          }
          fs.mkdirSync(`${res}/drawable`, { recursive: true });
          await sharp(src).resize(288, 288, { fit: 'contain', background: { r: 255, g: 255, b: 255, alpha: 0 } })
            .png().toFile(`${res}/drawable/ic_launcher_foreground.png`);
          fs.mkdirSync(`${res}/values`, { recursive: true });
          fs.writeFileSync(`${res}/values/ic_launcher_background.xml`,
            '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#FFFFFF</color></resources>');
          fs.mkdirSync(`${res}/mipmap-anydpi-v26`, { recursive: true });
          const adaptive = '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>';
          fs.writeFileSync(`${res}/mipmap-anydpi-v26/ic_launcher.xml`, adaptive);
          fs.writeFileSync(`${res}/mipmap-anydpi-v26/ic_launcher_round.xml`, adaptive);
          NODE

          # Ensure Android actually points at the generated launcher resources.
          python3 - <<'PYMANIFEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          A = '{http://schemas.android.com/apk/res/android}'
          tree = ET.parse(path)
          app = tree.getroot().find('application')
          if app is None:
              raise SystemExit('AndroidManifest application element missing')
          app.set(A + 'icon', '@mipmap/ic_launcher')
          app.set(A + 'roundIcon', '@mipmap/ic_launcher_round')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          ET.parse(path)
          PYMANIFEST

          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Configure Admin Android Manifest
        run: |
          python3 - <<'PYMAN'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          A = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()
          wanted = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]
          present = {x.get(A + "name") for x in root.findall("uses-permission")}
          for permission in wanted:
              if permission not in present:
                  node = ET.Element("uses-permission")
                  node.set(A + "name", permission)
                  root.insert(0, node)
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest application element missing")
          app.set(A + "label", "SastaGo Admin")
          app.set(A + "icon", "@mipmap/ic_launcher")
          app.set(A + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          ET.parse(path)
          PYMAN

      - name: Build Admin APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^(application-label|application-icon)"

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
