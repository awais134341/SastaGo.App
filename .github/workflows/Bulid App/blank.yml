name: SastaGo Customer and Admin APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
      - name: Configure Maven Central Mirror
        run: |
          mkdir -p ~/.gradle/init.d

          cat > ~/.gradle/init.d/maven-mirror.gradle <<'EOF'
          allprojects {
              repositories {
                  maven {
                      url "https://maven-central.storage-download.googleapis.com/maven2/"
                  }
              }

              buildscript {
                  repositories {
                      maven {
                          url "https://maven-central.storage-download.googleapis.com/maven2/"
                      }
                  }
              }
          }
          EOF
  # =====================================
  # CUSTOMER APP BUILD
  # =====================================

  build-customer:
    name: Build SastaGo Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Customer ZIP
        run: |
          test -f Customer-App.zip || {
            echo "Customer-App.zip missing!"
            exit 1
          }

          rm -rf customer-src www
          mkdir -p customer-src www

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          root = Path("customer-src").resolve()

          with zipfile.ZipFile("Customer-App.zip") as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  target = (root / name).resolve()

                  if target != root and root not in target.parents:
                      raise SystemExit("Unsafe ZIP path")

                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, open(target, "wb") as dst:
                          dst.write(src.read())
          PY

          ENTRY=$(find customer-src -type f -iname "Intro.html" -print -quit)

          if [ -z "$ENTRY" ]; then
            ENTRY=$(find customer-src -type f -iname "customer.html" -print -quit)
          fi

          test -n "$ENTRY" || {
            echo "Customer HTML not found"
            exit 1
          }

          cp -r "$(dirname "$ENTRY")"/. www/

          if [ -f www/Intro.html ]; then
            cp www/Intro.html www/index.html
          elif [ -f www/intro.html ]; then
            cp www/intro.html www/index.html
          elif [ -f www/customer.html ]; then
            cp www/customer.html www/index.html
          else
            echo "Customer index page missing"
            exit 1
          fi

          test -f www/customer-bill-tools.js
          test -f www/customer-location.js
          test -f www/customer-gps-capacitor.js

      - name: Generate Customer App Icon PNG
        run: |
          mkdir -p assets

          ICON=$(find customer-src -type f -iname "sastago-icon.svg" -print -quit)

          test -n "$ICON" || {
            echo "SastaGo icon SVG missing"
            exit 1
          }

          npm init -y
          npm install --no-save sharp

          ICON_FILE="$ICON" node --input-type=module -e "
          import sharp from 'sharp';
          const p = process.env.ICON_FILE;
          await sharp(p)
            .resize(1024, 1024, {
              fit: 'contain',
              background: '#ffffff'
            })
            .png()
            .toFile('assets/icon.png');
          "

      - name: Install Capacitor and Android Plugins
        run: |
          npm install --save-exact \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/geolocation@8 \
            @capgo/capacitor-file-sharer@8.1.16 \
            @capgo/capacitor-printer@8.1.11 \
            @capacitor/assets

          printf '%s\n' \
          '{"appId":"pk.sastago.customer","appName":"SastaGo Customer","webDir":"www"}' \
          > capacitor.config.json

          npx capacitor-assets generate --android

          npx cap add android
          npx cap sync android

      - name: Add Customer Location Permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"

          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"

          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"

          sed -i 's#<application#<application android:label="SastaGo Customer"#' "$MANIFEST"

      - name: Build Customer APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Configure Maven Central Mirror
        run: |
          mkdir -p ~/.gradle/init.d

          cat > ~/.gradle/init.d/maven-mirror.gradle <<'EOF'
          allprojects {
              repositories {
                  maven {
                      url "https://maven-central.storage-download.googleapis.com/maven2/"
                  }
              }

              buildscript {
                  repositories {
                      maven {
                          url "https://maven-central.storage-download.googleapis.com/maven2/"
                      }
                  }
              }
          }
          EOF
  # =====================================
  # ADMIN APP BUILD
  # =====================================

  build-admin:
    name: Build SastaGo Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Admin ZIP
        run: |
          test -f Admin-App.zip || {
            echo "Admin-App.zip missing!"
            exit 1
          }

          rm -rf admin-src www
          mkdir -p admin-src www

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          root = Path("admin-src").resolve()

          with zipfile.ZipFile("Admin-App.zip") as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  target = (root / name).resolve()

                  if target != root and root not in target.parents:
                      raise SystemExit("Unsafe ZIP path")

                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as src, open(target, "wb") as dst:
                          dst.write(src.read())
          PY

          ENTRY=$(find admin-src -type f -iname "admin.html" -print -quit)

          test -n "$ENTRY" || {
            echo "admin.html missing"
            exit 1
          }

          cp -r "$(dirname "$ENTRY")"/. www/
          cp "$ENTRY" www/index.html

          test -f www/admin.js
          test -f www/admin-bill-tools.js

      - name: Generate Admin App Icon PNG
        run: |
          mkdir -p assets

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile("Customer-App.zip") as z:
              matches = [
                  n for n in z.namelist()
                  if n.lower().endswith("sastago-icon.svg")
              ]

              if not matches:
                  raise SystemExit("SastaGo icon missing")

              Path("icon-source.svg").write_bytes(
                  z.read(matches[0])
              )
          PY

          npm init -y
          npm install --no-save sharp

          node --input-type=module -e "
          import sharp from 'sharp';

          await sharp('icon-source.svg')
            .resize(1024, 1024, {
              fit: 'contain',
              background: '#ffffff'
            })
            .png()
            .toFile('assets/icon.png');
          "

      - name: Install Capacitor and Android Plugins
        run: |
          npm install --save-exact \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8 \
            @capacitor/geolocation@8 \
            @capgo/capacitor-file-sharer@8.1.16 \
            @capgo/capacitor-printer@8.1.11 \
            @capacitor/assets

          printf '%s\n' \
          '{"appId":"pk.sastago.admin","appName":"SastaGo Admin","webDir":"www"}' \
          > capacitor.config.json

          npx capacitor-assets generate --android

          npx cap add android
          npx cap sync android

      - name: Add Admin Location Permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"

          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"

          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"

          sed -i 's#<application#<application android:label="SastaGo Admin"#' "$MANIFEST"

      - name: Build Admin APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
