name: SastaGo APK Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================
  # CUSTOMER APP
  # =========================

  build-customer:
    name: Build Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Customer ZIP
        shell: bash
        run: |
          set -e

          test -f Customer-App.zip

          mkdir -p customer-src www

          unzip -q Customer-App.zip -d customer-src

          chmod -R u+rwX,go+rX customer-src

          ENTRY=$(find customer-src -type f \( -iname "Intro.html" -o -iname "customer.html" \) | sort | head -n 1)

          if [ -z "$ENTRY" ]; then
            echo "Customer HTML not found"
            find customer-src -type f
            exit 1
          fi

          SOURCE_DIR=$(dirname "$ENTRY")

          cp -r "$SOURCE_DIR"/. www/

          chmod -R u+rwX,go+rX www/

          if [ -f www/Intro.html ]; then
            cp www/Intro.html www/index.html
          elif [ -f www/intro.html ]; then
            cp www/intro.html www/index.html
          elif [ -f www/customer.html ]; then
            cp www/customer.html www/index.html
          else
            echo "Customer entry page missing"
            exit 1
          fi

          test -f www/index.html
          test -f www/customer.js
          test -f www/customer-location.js
          test -f www/customer-bill-tools.js

          echo "Customer files extracted successfully"

      - name: Install Capacitor 8 and Native Plugins
        run: |
          npm init -y

          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/geolocation@8 @capgo/capacitor-file-sharer@8 @capgo/capacitor-printer@8

          printf '%s\n' '{"appId":"pk.sastago.customer","appName":"SastaGo","webDir":"www"}' > capacitor.config.json

          npx cap add android
          npx cap sync android

      - name: Generate Customer App Icon and Name
        run: |
          set -e

          python3 -m pip install Pillow

          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import shutil

          root = Path("www")

          # Find Customer icon, ignoring folder case and filename spaces.
          candidates = []

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              name = p.name.lower().replace(" ", "")
              path = str(p).lower()

              if "customer-icon" not in name and "customer-icon" not in path:
                  continue

              try:
                  with Image.open(p) as test:
                      test.verify()
                  candidates.append(p)
              except Exception:
                  continue

          if not candidates:
              raise SystemExit(
                  "Customer icon not found. Add a valid Customer PNG icon to the ZIP."
              )

          source = sorted(candidates, key=lambda p: ("(2)" in p, len(str(p))))[0]

          print("Customer icon selected:", source)

          with Image.open(source) as original:
              img = original.convert("RGBA")
              img = ImageOps.fit(
                  img,
                  (1024, 1024),
                  method=Image.Resampling.LANCZOS
              )

          icon_folder = root / "app-icons"
          icon_folder.mkdir(parents=True, exist_ok=True)

          normalized = icon_folder / "icon.png"
          img.save(normalized, "PNG")

          res = Path("android/app/src/main/res")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)

              resized = img.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              resized.save(target / "ic_launcher.png")
              resized.save(target / "ic_launcher_round.png")

          adaptive = res / "mipmap-anydpi-v26"

          if adaptive.exists():
              shutil.rmtree(adaptive)

          print("Customer launcher icons generated.")

          PY

          STRINGS=android/app/src/main/res/values/strings.xml

          mkdir -p android/app/src/main/res/values

          if [ ! -f "$STRINGS" ]; then
            printf '%s\n' '<resources></resources>' > "$STRINGS"
          fi

          if grep -q 'name="app_name"' "$STRINGS"; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">SastaGo</string>|' "$STRINGS"
          else
            sed -i 's|</resources>|    <string name="app_name">SastaGo</string>\n</resources>|' "$STRINGS"
          fi

      - name: Ensure Android Location Permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"

      - name: Build Customer APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  # =========================
  # ADMIN APP
  # =========================

  build-admin:
    name: Build Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Admin ZIP
        shell: bash
        run: |
          set -e

          test -f Admin-App.zip

          mkdir -p admin-src www

          unzip -q Admin-App.zip -d admin-src

          chmod -R u+rwX,go+rX admin-src

          ENTRY=$(find admin-src -type f -iname "admin.html" | head -n 1)

          if [ -z "$ENTRY" ]; then
            echo "Admin HTML file not found"
            find admin-src -type f
            exit 1
          fi

          SOURCE_DIR=$(dirname "$ENTRY")

          cp -r "$SOURCE_DIR"/. www/

          chmod -R u+rwX,go+rX www/

          cp "$ENTRY" www/index.html

          test -f www/index.html
          test -f www/admin.js
          test -f www/admin-bill-tools.js

          echo "Admin files extracted successfully"

      - name: Install Capacitor 8
