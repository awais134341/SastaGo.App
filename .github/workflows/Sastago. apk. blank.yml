              resized.save(target / "ic_launcher.png")
              resized.save(target / "ic_launcher_round.png")

          adaptive = res / "mipmap-anydpi-v26"

          if adaptive.exists():
              shutil.rmtree(adaptive)

          print("Admin launcher icons generated.")

          PY

          STRINGS=android/app/src/main/res/values/strings.xml

          mkdir -p android/app/src/main/res/values

          if [ ! -f "$STRINGS" ]; then
            printf '%s\n' '<resources></resources>' > "$STRINGS"
          fi

          if grep -q 'name="app_name"' "$STRINGS"; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">SastaGo Admin</string>|' "$STRINGS"
          else
            sed -i 's|</resources>|    <string name="app_name">SastaGo Admin</string>\n</resources>|' "$STRINGS"
          fi

      - name: Build Admin APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
