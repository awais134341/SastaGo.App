name: SastaGo APK Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-customer:
    name: Build Customer APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Customer ZIP
        run: |
          test -f Customer-App.zip || { echo 'Customer-App.zip missing from repository root'; exit 1; }
          mkdir -p customer-src www
          unzip -q Customer-App.zip -d customer-src
          ENTRY=$(find customer-src -type f -iname 'Intro.html' | head -n 1)
          if [ -z "$ENTRY" ]; then ENTRY=$(find customer-src -type f -iname 'customer.html' | head -n 1); fi
          if [ -z "$ENTRY" ]; then echo 'Customer entry HTML not found'; find customer-src -type f; exit 1; fi
          cp -a "$(dirname "$ENTRY")"/. www/
          if [ -f www/Intro.html ]; then cp www/Intro.html www/index.html; \
          elif [ -f www/intro.html ]; then cp www/intro.html www/index.html; \
          elif [ -f www/customer.html ]; then cp www/customer.html www/index.html; \
          else echo 'Customer entry page could not be prepared'; exit 1; fi
          test -f www/customer.js
          test -f www/customer-location.js
          test -f www/customer-bill-tools.js

      - name: Install Capacitor and Native Plugins
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/geolocation@7 @capgo/capacitor-file-sharer @capgo/capacitor-printer
          printf '%s\n' '{"appId":"pk.sastago.customer","appName":"SastaGo Customer","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Ensure Android Location Permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"

      - name: Build Customer APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-admin:
    name: Build Admin APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Admin ZIP
        run: |
          test -f Admin-App.zip || { echo 'Admin-App.zip missing from repository root'; exit 1; }
          mkdir -p admin-src www
          unzip -q Admin-App.zip -d admin-src
          ENTRY=$(find admin-src -type f -iname 'admin.html' | head -n 1)
          if [ -z "$ENTRY" ]; then echo 'Admin HTML file not found'; find admin-src -type f; exit 1; fi
          cp -a "$(dirname "$ENTRY")"/. www/
          cp "$ENTRY" www/index.html
          test -f www/admin.js
          test -f www/admin-bill-tools.js

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          printf '%s\n' '{"appId":"pk.sastago.admin","appName":"SastaGo Admin","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build Admin APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
