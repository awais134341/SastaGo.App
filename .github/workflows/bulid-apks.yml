name: SastaGo APK Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-customer:
    name: Build Customer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Customer ZIP
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          import shutil

          zip_path = "Customer-App.zip"
          if not os.path.isfile(zip_path):
              raise SystemExit("Customer-App.zip missing from repository root")

          os.makedirs("customer-src", exist_ok=True)
          os.makedirs("www", exist_ok=True)

          with zipfile.ZipFile(zip_path) as z:
              z.extractall("customer-src")

          for root, dirs, files in os.walk("customer-src"):
              for d in dirs:
                  os.chmod(os.path.join(root, d), 0o755)
              for f in files:
                  os.chmod(os.path.join(root, f), 0o644)

          entry = None
          for root, dirs, files in os.walk("customer-src"):
              for f in files:
                  if f.lower() in ("intro.html", "customer.html"):
                      entry = os.path.join(root, f)
                      if f.lower() == "intro.html":
                          break
              if entry:
                  break

          if not entry:
              raise SystemExit("Customer entry HTML not found")

          source_dir = os.path.dirname(entry)

          for item in os.listdir(source_dir):
              src = os.path.join(source_dir, item)
              dst = os.path.join("www", item)

              if os.path.isdir(src):
                  shutil.copytree(src, dst, dirs_exist_ok=True)
              else:
                  shutil.copy2(src, dst)

          intro = os.path.join("www", "Intro.html")
          if not os.path.isfile(intro):
              intro = os.path.join("www", "intro.html")

          if os.path.isfile(intro):
              shutil.copy2(intro, "www/index.html")
          elif os.path.isfile(os.path.join("www", "customer.html")):
              shutil.copy2("www/customer.html", "www/index.html")
          else:
              raise SystemExit("Customer entry page could not be prepared")

          for root, dirs, files in os.walk("www"):
              for d in dirs:
                  os.chmod(os.path.join(root, d), 0o755)
              for f in files:
                  os.chmod(os.path.join(root, f), 0o644)

          print("Customer files extracted successfully")
          PY

          test -f www/index.html
          test -f www/customer.js
          test -f www/customer-location.js
          test -f www/customer-bill-tools.js

      - name: Install Capacitor 8 and Native Plugins
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/geolocation@8 @capgo/capacitor-file-sharer@8 @capgo/capacitor-printer@8

          printf '%s\n' '{"appId":"pk.sastago.customer","appName":"SastaGo Customer","webDir":"www"}' > capacitor.config.json

          npx cap add android
          npx cap sync android

      - name: Ensure Android Location Permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' "$MANIFEST"

      - name: Build Customer APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: SastaGo-Customer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

