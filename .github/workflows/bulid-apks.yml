name: SastaGo APK Builder

on:
workflow_dispatch:

jobs:
build-customer:
name: Build Customer APK
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Setup Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '21'

  - name: Setup Android SDK
    run: |
      SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
      yes | "$SDKMANAGER" --licenses || true
      "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Extract Customer Files
    run: |
      mkdir -p customer-src www
      unzip -q Customer-App.zip -d customer-src

      chmod -R u+rwX customer-src

      ENTRY=$(find customer-src -iname "Intro.html" | head -n 1)

      if [ -z "$ENTRY" ]; then
        ENTRY=$(find customer-src -iname "customer.html" | head -n 1)
      fi

      if [ -z "$ENTRY" ]; then
        echo "Customer HTML not found"
        exit 1
      fi

      cp -r "$(dirname "$ENTRY")"/. www/
      chmod -R u+rwX www/

      if [ -f www/Intro.html ]; then
        cp www/Intro.html www/index.html
      elif [ -f www/intro.html ]; then
        cp www/intro.html www/index.html
      else
        cp "$ENTRY" www/index.html
      fi

  - name: Setup Capacitor
    run: |
      npm init -y
      npm install @capacitor/core @capacitor/cli @capacitor/android

      echo '{"appId":"pk.sastago.customer","appName":"SastaGo Customer","webDir":"www"}' > capacitor.config.json

      npx cap add android
      npx cap sync android

  - name: Build Customer APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload Customer APK
    uses: actions/upload-artifact@v4
    with:
      name: SastaGo-Customer-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk

build-admin:
name: Build Admin APK
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Setup Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '21'

  - name: Setup Android SDK
    run: |
      SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
      yes | "$SDKMANAGER" --licenses || true
      "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Extract Admin Files
    run: |
      mkdir -p admin-src www
      unzip -q Admin-App.zip -d admin-src

      chmod -R u+rwX admin-src

      ENTRY=$(find admin-src -iname "admin.html" | head -n 1)

      if [ -z "$ENTRY" ]; then
        echo "Admin HTML not found"
        exit 1
      fi

      cp -r "$(dirname "$ENTRY")"/. www/
      chmod -R u+rwX www/
      cp "$ENTRY" www/index.html

  - name: Setup Capacitor
    run: |
      npm init -y
      npm install @capacitor/core @capacitor/cli @capacitor/android

      echo '{"appId":"pk.sastago.admin","appName":"SastaGo Admin","webDir":"www"}' > capacitor.config.json

      npx cap add android
      npx cap sync android

  - name: Build Admin APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload Admin APK
    uses: actions/upload-artifact@v4
    with:
      name: SastaGo-Admin-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
