<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024"
     viewBox="0 0 1024 1024">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#087A35"/>
    </linearGradient>

    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24"
                    flood-color="#003D1B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="180" r="90" fill="#FFFFFF" opacity="0.07"/>
  <circle cx="880" cy="850" r="150" fill="#FFFFFF" opacity="0.06"/>

  <!-- Shopping Bag -->
  <g filter="url(#shadow)">
    <path d="M285 350
             Q285 315 325 315
             H699
             Q739 315 739 350
             L785 785
             Q790 835 740 835
             H284
             Q234 835 239 785 Z"
          fill="url(#bag)"/>

    <!-- Bag Handle -->
    <path d="M390 355
             V270
             Q390 175 512 175
             Q634 175 634 270
             V355"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="48"
          stroke-linecap="round"/>
  </g>

  <!-- S Letter -->
  <text x="512" y="675"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="390"
        font-weight="900"
        fill="#16A34A">S</text>

  <!-- Yellow Shopping Tag -->
  <path d="M720 185 L850 185 L850 315 L785 365 L720 315 Z"
        fill="#FACC15"
        transform="rotate(12 785 275)"/>

  <circle cx="785" cy="235" r="15" fill="#FFFFFF"/>

</svg>